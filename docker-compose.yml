services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    environment:
      PORT: 8000
      CLIENT_ORIGIN: ""
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
