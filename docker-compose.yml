services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: on-failure:5
    environment:
      PORT: 8000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
