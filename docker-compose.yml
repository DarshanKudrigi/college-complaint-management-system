services:
  db-init:
    image: ${DOCKERHUB_USERNAME:-local}/college-complaint-backend:latest
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: npm run init-db
    restart: "no"

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/college-complaint-backend:latest
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    environment:
      PORT: 8000
      CLIENT_ORIGIN: ""
    expose:
      - "8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/college-complaint-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
